name: pr

# PR CI, manual only (workflow_dispatch) until the fork is integrated: PRs are
# checked locally with .github/scripts/ci-local.sh, which runs the same lint, build and Rust-test steps in
# the same image (see FORK.md, "Checks").
#
# lint, a release build of Postgres v17 and the Rust binaries, the Rust
# unit tests, and the sharded pytest regression suite. `ci-ok` is the one
# summary job (branch protection requires no status check at present).
#
# Every job except `ci-ok` runs inside the build-tools image
# (ghcr.io/chelabase/neon-build-tools), as root at the container level so the
# first step can hand the workspace to the image's `nonroot` user; every `run`
# step then runs as `nonroot` through .github/scripts/as-nonroot.sh.
#
# PG_VERSION and BUILD_TYPE are kept in one place (`env` below) so that this
# workflow can become reusable (`workflow_call` with pg_version/build_type
# inputs) with a small change.

on:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

env:
  PG_VERSION: v17
  BUILD_TYPE: release
  CARGO_FLAGS: --locked --features testing
  CARGO_HOME: /home/nonroot/.cargo
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  COPT: -Werror

jobs:
  build-tools:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-tools.yml

  lint:
    needs: [build-tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.build-tools.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --init --shm-size=512mb --ulimit memlock=67108864:67108864
    defaults:
      run:
        shell: bash .github/scripts/as-nonroot.sh {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false

      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/nonroot/.cache/pypoetry/virtualenvs
          key: poetry-${{ needs.build-tools.outputs.image }}-${{ hashFiles('poetry.lock') }}

      - name: known_failures.sh self-test
        run: .github/scripts/known_failures_test.sh

      - name: advisory_issue.sh self-test
        run: .github/scripts/advisory_issue_test.sh

      - name: publish-dev.sh self-test
        run: .github/scripts/publish-dev_test.sh

      - name: actionlint
        if: ${{ !cancelled() }}
        run: |
          v=1.7.12
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -sSfL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${v}/actionlint_${v}_linux_amd64.tar.gz"
          echo "${sha}  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      - name: cargo fmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

      - name: Postgres headers (postgres_ffi binds every major)
        if: ${{ !cancelled() }}
        run: make -j"$(nproc)" postgres-headers

      # Upstream's flags (.neon_clippy_args, as used by run_clippy.sh), with
      # `--features testing` instead of `--all-features`: the `rest_broker`
      # feature needs Neon's private subzero crate, which we only have as a stub.
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: |
          CLIPPY_COMMON_ARGS="$(source .neon_clippy_args; echo "$CLIPPY_COMMON_ARGS")"
          # shellcheck disable=SC2086
          cargo clippy --features testing $CLIPPY_COMMON_ARGS

      - name: cargo deny (advisories, bans, licenses, sources)
        if: ${{ !cancelled() }}
        run: cargo deny check --hide-inclusion-graph

      - name: Python deps
        if: ${{ !cancelled() }}
        run: ./scripts/pysync

      - name: ruff and mypy
        if: ${{ !cancelled() }}
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy .

  build-v17:
    needs: [build-tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.build-tools.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --init --shm-size=512mb --ulimit memlock=67108864:67108864 --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash .github/scripts/as-nonroot.sh {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Disk before the build
        run: df -h

      - name: Postgres revisions
        id: pg_rev
        run: |
          for v in v14 v15 v16 v17; do
            echo "${v}=$(git rev-parse "HEAD:vendor/postgres-${v}")" | tee -a "$GITHUB_OUTPUT"
          done

      # pg_install/v17 plus the test programs the regression suite runs from
      # build/v17, and the v14-v16 headers that postgres_ffi needs.
      - name: Cache the Postgres build
        id: pg_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pg_install
            build/${{ env.PG_VERSION }}/src/test/regress/*.so
            build/${{ env.PG_VERSION }}/src/test/regress/pg_regress
            build/${{ env.PG_VERSION }}/src/test/isolation/isolationtester
            build/${{ env.PG_VERSION }}/src/test/isolation/pg_isolation_regress
          key: pg-${{ env.PG_VERSION }}-${{ env.BUILD_TYPE }}-${{ steps.pg_rev.outputs.v17 }}-h-${{ steps.pg_rev.outputs.v14 }}-${{ steps.pg_rev.outputs.v15 }}-${{ steps.pg_rev.outputs.v16 }}-${{ hashFiles('Makefile', 'postgres.mk') }}-${{ needs.build-tools.outputs.image }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true

      - name: Build Postgres ${{ env.PG_VERSION }}, the extensions and the Rust binaries
        env:
          PG_CACHED: ${{ steps.pg_cache.outputs.cache-hit }}
        run: |
          start=$(date +%s)
          if [[ "$PG_CACHED" == "true" ]]; then
            export PG_INSTALL_CACHED=1
          else
            # postgres_ffi generates bindings for every major, so it needs all headers.
            make -j"$(nproc)" postgres-headers-install-v14 postgres-headers-install-v15 postgres-headers-install-v16
          fi
          # walproposer-lib (part of `all`) always uses v17, so v17 stays in the list
          # if PG_VERSION is ever changed to v14-v16 (as ci-local.sh's build_versions).
          versions="$PG_VERSION"
          [[ "$PG_VERSION" == v17 ]] || versions="$PG_VERSION v17"
          mold -run make -j"$(nproc)" POSTGRES_VERSIONS="$versions" BUILD_TYPE="$BUILD_TYPE" \
            CARGO_BUILD_FLAGS="$CARGO_FLAGS" all
          echo "build took $(( $(date +%s) - start ))s"

      - name: Disk after the build
        if: ${{ !cancelled() }}
        run: |
          df -h
          du -sh target pg_install build 2>/dev/null || true

      - name: Pack the artifact
        run: |
          out=/tmp/neon
          rm -rf "$out"
          mkdir -p "$out/bin"
          # shellcheck disable=SC2086
          bins=$(cargo metadata $CARGO_FLAGS --format-version=1 --no-deps |
            jq -r '.packages[].targets[] | select(.kind | index("bin")) | .name')
          for bin in $bins; do
            if [[ -f "target/$BUILD_TYPE/$bin" ]]; then
              cp "target/$BUILD_TYPE/$bin" "$out/bin/"
            else
              echo "::notice::binary $bin was not built with '$CARGO_FLAGS'"
            fi
          done
          tar -c "pg_install/$PG_VERSION" \
            build/"$PG_VERSION"/src/test/regress/*.so \
            "build/$PG_VERSION/src/test/regress/pg_regress" \
            "build/$PG_VERSION/src/test/isolation/isolationtester" \
            "build/$PG_VERSION/src/test/isolation/pg_isolation_regress" |
            tar -x -C "$out"
          tar -C "$out" -I 'zstd -T0 -3' -cf neon-artifact.tar.zst .
          ls -lh neon-artifact.tar.zst
          du -sh "$out"/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neon-${{ env.PG_VERSION }}-${{ env.BUILD_TYPE }}
          path: neon-artifact.tar.zst
          compression-level: 0
          retention-days: 5
          if-no-files-found: error

  rust-tests:
    # Runs in parallel with build-v17 and builds what it needs itself: the
    # unit tests (postgres_ffi's wal_craft, the pageserver's walredo) start
    # Postgres of every major, so this job builds v14-v17 (cached).
    needs: [build-tools]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.build-tools.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --init --shm-size=512mb --ulimit memlock=67108864:67108864 --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash .github/scripts/as-nonroot.sh {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Postgres revisions
        id: pg_rev
        run: |
          for v in v14 v15 v16 v17; do
            echo "${v}=$(git rev-parse "HEAD:vendor/postgres-${v}")" | tee -a "$GITHUB_OUTPUT"
          done

      - name: Cache the Postgres builds
        id: pg_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pg_install
          key: pg-all-${{ env.BUILD_TYPE }}-${{ steps.pg_rev.outputs.v14 }}-${{ steps.pg_rev.outputs.v15 }}-${{ steps.pg_rev.outputs.v16 }}-${{ steps.pg_rev.outputs.v17 }}-${{ hashFiles('Makefile', 'postgres.mk') }}-${{ needs.build-tools.outputs.image }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true

      - name: Build Postgres v14-v17 and the extensions
        env:
          PG_CACHED: ${{ steps.pg_cache.outputs.cache-hit }}
        run: |
          start=$(date +%s)
          if [[ "$PG_CACHED" == "true" ]]; then
            export PG_INSTALL_CACHED=1
          fi
          mold -run make -j"$(nproc)" BUILD_TYPE="$BUILD_TYPE" CARGO_BUILD_FLAGS="$CARGO_FLAGS" \
            postgres-install neon-pg-ext walproposer-lib
          echo "postgres build took $(( $(date +%s) - start ))s"

      - name: cargo nextest
        env:
          NEXTEST_RETRIES: 3
        run: |
          start=$(date +%s)
          export LD_LIBRARY_PATH="$PWD/pg_install/v17/lib"
          # shellcheck disable=SC2086
          mold -run cargo test --doc $CARGO_FLAGS --release
          # Quarantined Rust tests, each with its reason:
          # - binary(test_real_gcs): needs a real GCS bucket (GCS_TEST_BUCKET); unlike
          #   the S3 and Azure suites it doesn't skip itself when unconfigured.
          # shellcheck disable=SC2086
          mold -run cargo nextest run $CARGO_FLAGS --release --no-fail-fast \
            -E 'not (package(remote_storage) and binary(test_real_gcs))'
          echo "rust tests took $(( $(date +%s) - start ))s"

      - name: Disk at the end
        if: ${{ !cancelled() }}
        run: |
          df -h
          du -sh target pg_install build 2>/dev/null || true

  regress-v17:
    needs: [build-tools, build-v17]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.build-tools.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root --init --shm-size=512mb --ulimit memlock=67108864:67108864 --security-opt seccomp=unconfined
    defaults:
      run:
        shell: bash .github/scripts/as-nonroot.sh {0}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Cache poetry deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/nonroot/.cache/pypoetry/virtualenvs
          key: poetry-${{ needs.build-tools.outputs.image }}-${{ hashFiles('poetry.lock') }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: neon-${{ env.PG_VERSION }}-${{ env.BUILD_TYPE }}
          path: /tmp/neon-artifact

      - name: Unpack the artifact
        run: |
          mkdir -p /tmp/neon
          tar -C /tmp/neon -I zstd -xf /tmp/neon-artifact/neon-artifact.tar.zst

      - name: Python deps
        run: ./scripts/pysync

      - name: pytest (group ${{ matrix.group }} of ${{ strategy.job-total }})
        env:
          GROUP: ${{ matrix.group }}
          SPLITS: ${{ strategy.job-total }}
          NEON_BIN: /tmp/neon/bin
          POSTGRES_DISTRIB_DIR: /tmp/neon/pg_install
          TEST_OUTPUT: /tmp/test_output
          PAGESERVER_VIRTUAL_FILE_IO_ENGINE: tokio-epoll-uring
          PLATFORM: github-actions
        run: |
          export DEFAULT_PG_VERSION="${PG_VERSION#v}"
          export LD_LIBRARY_PATH="$POSTGRES_DISTRIB_DIR/$PG_VERSION/lib"
          # Into a file first: `mapfile < <(...)` would ignore the script's exit status.
          .github/scripts/known_failures.sh >/tmp/known_failures.args
          mapfile -t deselect </tmp/known_failures.args
          start=$(date +%s)
          ./scripts/pytest test_runner/regress \
            -n 3 --dist=loadgroup \
            --splits "$SPLITS" --group "$GROUP" \
            --splitting-algorithm least_duration \
            --durations-path .test_durations --store-durations \
            --reruns 2 \
            --session-timeout=6600 \
            --tb=short --verbose -rA \
            --junitxml="$TEST_OUTPUT/junit.xml" \
            "${deselect[@]}"
          echo "pytest took $(( $(date +%s) - start ))s"

      - name: Upload the measured durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-durations-${{ matrix.group }}
          path: .test_durations
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn

      - name: Collect logs of the run
        if: ${{ !cancelled() }}
        run: |
          [[ -d /tmp/test_output ]] || exit 0
          cd /tmp/test_output
          find . \( -name '*.log' -o -name '*.diffs' -o -name 'junit.xml' -o -name '*.stderr' -o -name '*.stdout' \) \
            -size -50M -print0 | tar --null -T - -I 'zstd -T0 -3' -cf "$GITHUB_WORKSPACE/test-logs.tar.zst"
          ls -lh "$GITHUB_WORKSPACE/test-logs.tar.zst"

      - name: Upload the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ matrix.group }}
          path: test-logs.tar.zst
          compression-level: 0
          retention-days: 7
          if-no-files-found: ignore

  ci-ok:
    if: always()
    needs: [build-tools, lint, build-v17, rust-tests, regress-v17]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
