name: build-tools

# Builds build-tools/Dockerfile (bookworm, amd64) into
#   ghcr.io/cheladb/neon-build-tools:<first 12 hex of sha256sum build-tools/Dockerfile>
# unless that tag already exists. Every CI job runs inside this image.
# pr.yml calls this workflow first, so the tag always exists before it is used.

on:
  push:
    branches: [main]
    paths:
      - build-tools/**
      - .github/workflows/build-tools.yml
  pull_request:
    paths:
      - build-tools/**
      - .github/workflows/build-tools.yml
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: The build-tools image reference (with tag)
        value: ${{ jobs.build.outputs.image }}

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the image tag
        id: tag
        run: |
          tag="$(sha256sum build-tools/Dockerfile | cut -c1-12)"
          echo "image=ghcr.io/cheladb/neon-build-tools:${tag}" | tee -a "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the tag exists
        id: check
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "found=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "found=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.check.outputs.found == 'false'

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.check.outputs.found == 'false'
        with:
          context: .
          file: build-tools/Dockerfile
          build-args: |
            DEBIAN_VERSION=bookworm
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.tag.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=ghcr.io/cheladb/neon-build-tools:buildcache
          cache-to: type=registry,ref=ghcr.io/cheladb/neon-build-tools:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
